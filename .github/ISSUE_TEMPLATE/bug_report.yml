name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove credentials, API keys, cookies, signed URLs, account IDs, private object names, and sensitive logs before submitting. Security vulnerabilities must follow the [security policy](https://github.com/alwynou/openpool/security/policy), not this form.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not contain secrets or sensitive object data.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: input
    id: version
    attributes:
      label: OpenPool version
      description: Provide a release tag or commit SHA.
      placeholder: v0.1.0-rc.1 or abc1234
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Self-hosted Cloudflare deployment
        - Tests or CI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction without secrets or private data.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs, screenshots, browser/runtime versions, or provider kind after removing sensitive values.
      render: shell
